name: OpenBattery
options:
  bundleIdPrefix: cl.franciscosolis
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 376N27T2BP
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    # Apple Silicon only: Intel Macs are not supported.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  OpenBattery:
    type: application
    platform: macOS
    sources:
      - Sources/OpenBattery
    settings:
      base:
        PRODUCT_NAME: OpenBattery
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openbattery
        INFOPLIST_FILE: Sources/OpenBattery/Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES

  OpenBatteryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/OpenBattery/BatteryDecoding.swift
      - path: Sources/OpenBattery/BatterySnapshot.swift
      - path: Sources/OpenBattery/Formatting.swift
      - path: Sources/OpenBattery/MenuBarConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openbattery.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenBattery:
    build:
      targets:
        OpenBattery: all
        OpenBatteryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OpenBatteryTests]
