name: OpenBattery
options:
  bundleIdPrefix: cl.franciscosolis
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Two shapes of the same app. Release is the sandboxed build the App Store and
# TestFlight take; Release-Direct is the notarized DMG, which is not sandboxed
# because reading a connected iPhone needs /var/run/usbmuxd and the sandbox
# denies that socket. Debug matches the direct build so devices work while
# developing. The code is identical in all three: device support detects the
# socket at runtime rather than being compiled in or out.
configs:
  Debug: debug
  Release: release
  Release-Direct: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: PX7HA29NR3
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    # Apple Silicon only: Intel Macs are not supported.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
    Release-Direct:
      SWIFT_COMPILATION_MODE: wholemodule

# Pinned to a minor version rather than `from`: the Xcode project is generated
# and not committed, so its Package.resolved never reaches the repository and a
# floating range would let CI resolve a version this code has never seen.
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    minorVersion: 2.103.0
  swift-nio-ssl:
    url: https://github.com/apple/swift-nio-ssl.git
    minorVersion: 2.37.5

targets:
  OpenBattery:
    type: application
    platform: macOS
    sources:
      - Sources/OpenBattery
    dependencies:
      # Talking to a device means a plaintext plist handshake that then upgrades
      # to mutual TLS on the same connection. Network.framework cannot upgrade a
      # live stream and SecureTransport is deprecated, so NIO carries the
      # transport and NIOSSL the upgrade.
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-nio-ssl
        product: NIOSSL
    settings:
      base:
        PRODUCT_NAME: OpenBattery
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openbattery
        INFOPLIST_FILE: Sources/OpenBattery/Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/OpenBattery/Resources/OpenBattery-Direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/OpenBattery/Resources/OpenBattery.entitlements
        Release-Direct:
          CODE_SIGN_ENTITLEMENTS: Sources/OpenBattery/Resources/OpenBattery-Direct.entitlements

  OpenBatteryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/OpenBattery/BatteryDecoding.swift
      - path: Sources/OpenBattery/BatterySnapshot.swift
      - path: Sources/OpenBattery/Devices/DeviceBattery.swift
      - path: Sources/OpenBattery/Devices/PlistChannel.swift
      - path: Sources/OpenBattery/Formatting.swift
      - path: Sources/OpenBattery/MenuBarConfig.swift
      - path: Sources/OpenBattery/SampleLog.swift
    dependencies:
      # Only PlistChannel needs these, and only so the transport's deadline and
      # framing can be tested against a stub usbmuxd.
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOFoundationCompat
      - package: swift-nio-ssl
        product: NIOSSL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.franciscosolis.openbattery.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenBattery:
    build:
      targets:
        OpenBattery: all
        OpenBatteryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OpenBatteryTests]
