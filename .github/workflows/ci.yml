name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      # No signing certificate exists on the runner, so signing is switched off.
      # Everything else matches what `make test` and `make build` do locally.
      - name: Test
        run: make test XCODEBUILD_FLAGS='CODE_SIGNING_ALLOWED=NO'

      # Both shapes of the app: the notarized direct build and the sandboxed one
      # the App Store takes. A broken entitlements file in either should fail
      # here rather than at tag time.
      - name: Build (Release-Direct)
        run: make build CONFIG=Release-Direct XCODEBUILD_FLAGS='CODE_SIGNING_ALLOWED=NO'

      - name: Build (Release, App Store)
        run: make build CONFIG=Release XCODEBUILD_FLAGS='CODE_SIGNING_ALLOWED=NO'
