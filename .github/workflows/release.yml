name: Release

# Tags only. Publishing a GitHub Release creates a tag too, so this one workflow
# covers both cases. Every tag ships both apps, in parallel:
#
# - iOS: built with the App Store distribution signature and uploaded to
#   TestFlight. Never a direct App Store submission: the build sits there until
#   someone deliberately promotes it, so shipping stays a manual act.
# - macOS: built with Developer ID, notarized, and attached to the tag's GitHub
#   Release as a DMG and a zip. The Mac app does not go through the App Store.
#   The Developer ID certificate cannot be *created* through the App Store
#   Connect API, but once imported into match it is read like any other.
#
# Tag format: <version>[+<build>], with an optional leading "v".
#   1.4.0+7  → version 1.4.0, build 7
#   1.4.0    → version 1.4.0, build 1
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. 1.0.0+1"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
  MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
  MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
  MATCH_REPOSITORY_URL: ${{ secrets.MATCH_REPOSITORY_URL }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      # Fail in seconds, naming the secret, instead of minutes later inside match.
      - name: Check secrets
        run: |
          missing=0
          check() {
            if [ -z "$(printenv "$1")" ]; then
              echo "::error::Missing secret $1 — $2"
              missing=1
            fi
          }
          check ASC_KEY_ID "App Store Connect API key ID (App Manager role)"
          check ASC_ISSUER_ID "App Store Connect API issuer ID"
          check ASC_KEY_CONTENT "the .p8 API key, base64-encoded"
          check MATCH_PASSWORD "passphrase of the match certificates repo"
          check MATCH_GIT_BASIC_AUTHORIZATION "base64 of user:token, token with read access to the match repo"
          check MATCH_REPOSITORY_URL "HTTPS URL of the match certificates repo"
          exit "$missing"

      # The tag reaches the shell through the environment, never interpolated
      # into the script: a ref name is attacker-shaped input.
      - name: Read version from the tag
        id: version
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          case "$TAG" in
            *[!A-Za-z0-9.+_-]*)
              echo "Refusing tag with unexpected characters: $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          BUILD="1"
          case "$VERSION" in
            *+*)
              BUILD="${VERSION##*+}"
              VERSION="${VERSION%%+*}"
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($BUILD) from $TAG"

  testflight:
    name: TestFlight
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # Fully qualified: a bare name would also match a branch called the
      # same, and a dispatched run must build the tag it names, nothing else.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      # Ruby 4: Gemfile.lock is in bundler 4's format, which bundler 2.x — what
      # a 3.x runner ships — cannot read.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      # The iOS app, signed with Apple Distribution and its App Store profile
      # from match.
      - name: Build and upload to TestFlight
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: bundle exec fastlane ios release version:"$VERSION" build_number:"$BUILD"

      - name: Keep the IPA with the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: OpenBattery-iOS-${{ needs.prepare.outputs.version }}-ipa
          path: build/*.ipa
          if-no-files-found: error

  github:
    name: GitHub Release
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    # The only job that writes: it creates the Release and attaches the files.
    permissions:
      contents: write
    steps:
      # Fully qualified: a bare name would also match a branch called the
      # same, and a dispatched run must build the tag it names, nothing else.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      # uv runs the pinned dmgbuild that lays out the disk image.
      - name: Install build tools
        run: brew install xcodegen uv

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      # Developer ID signature, notarized and stapled: the app, then the DMG,
      # then a zip of the stapled app.
      - name: Build, notarize and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
        run: bundle exec fastlane mac release_github version:"$VERSION" build_number:"$BUILD"

      # Re-running a tag replaces its files rather than failing on the Release
      # the first run created.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          files=(build/OpenBattery-"$VERSION".dmg build/OpenBattery-"$VERSION".zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag \
              --title "OpenBattery $VERSION" --generate-notes
          fi
