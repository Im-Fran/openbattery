name: Release

# Tags only. Publishing a GitHub Release creates a tag too, so this one workflow
# covers both cases: every tag is archived with the App Store distribution
# signature and uploaded to App Store Connect.
#
# TestFlight always, never a direct App Store submission: the build sits there
# until someone deliberately promotes it, so shipping stays a manual act.
#
# The Developer ID route — the notarized DMG — is not run here: that certificate
# cannot be created through the App Store Connect API, so it is a local lane
# (`fastlane release_github`) rather than part of the pipeline.
#
# Tag format: <version>[+<build>], with an optional leading "v".
#   1.4.0+7  → version 1.4.0, build 7
#   1.4.0    → version 1.4.0, build 1
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. 1.0.0+1"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

    steps:
      - uses: actions/checkout@v7

      # The tag reaches the shell through the environment, never interpolated
      # into the script: a ref name is attacker-shaped input.
      - name: Read version from the tag
        id: version
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          case "$TAG" in
            *[!A-Za-z0-9.+_-]*)
              echo "Refusing tag with unexpected characters: $TAG" >&2
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          BUILD="1"
          case "$VERSION" in
            *+*)
              BUILD="${VERSION##*+}"
              VERSION="${VERSION%%+*}"
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION ($BUILD) from $TAG"

      # Ruby 4: Gemfile.lock is in bundler 4's format, which bundler 2.x — what
      # a 3.x runner ships — cannot read.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install build tools
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodegen --version

      # Apple Distribution plus the app-store provisioning profile, packaged as
      # a .pkg signed with the Mac installer certificate — the only shape App
      # Store Connect accepts.
      - name: Build and upload to TestFlight
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: bundle exec fastlane release_appstore version:"$VERSION" build_number:"$BUILD"

      - name: Keep the installer with the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: OpenBattery-${{ steps.version.outputs.version }}-pkg
          path: build/*.pkg
          if-no-files-found: error
